<!DOCTYPE html>
<head>
    <meta charset = "utf-8">
    <style>@import "../../style.css";</style>
    <script src = "../../lang.js"></script>
    <script src = "../../basic.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            document.getElementById("lang").addEventListener("change", function (e) { lang = e.target.value; upd_lang() })
            document.getElementById("form").addEventListener("submit", async function(e) { submit(e) })
            upd_lang(); upd_theme()
            setInterval(upd_theme, 5000)
            tmp = new URLSearchParams(window.location.search)
            if (Array.from(document.getElementById("lang").options).some(t => t.value == tmp.get("lang"))) {
                document.getElementById("lang").value = tmp.get("lang")
            }
        })
        async function submit(e) {
            e.preventDefault()
            server = "https://class-album-api.onrender.com/submit"
            form = new FormData(document.getElementById('form')).entries()
            result = document.getElementById('result')
            json = {}
            for ([key, value] of form) {
                json[key] = value
            }
            result.innerHTML = "posting to the server..."
            try {
                response = await fetch(server, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(json)
                })
                responseText = ""
                if (response.headers.get("content-type")?.includes("application/json")) {
                    responseText = JSON.stringify(await response.json())
                }
                else {
                    responseText = await response.text()
                }
                if (response.ok) {
                    result.innerHTML = `posted successfully:<br>status: ${response.status}<br>response: ${responseText}`
                }
                else {
                    result.innerHTML = `error:<br>failed to post to the server<br>status: ${response.status}<br>${response.statusText}<br>response text: ${responseText}<br><br>Please try it later.`
                }
            }
            catch (error) {
                result.innerHTML = `error:<br>failed to post to the server<br>message: ${error.message}<br><br>Please try it later.`
            }
        }
    </script>
</head>

<body>
    <title title = "title2"></title>
    <select name = "language" id = "lang" class = "lang" theme>
        <option value = "zh-cn">简体中文</option>
        <option value = "en-us">English(US)</option>
    </select>
    <form id = "form">
        <label text = "text3" theme></label>
        <input type = "text" name = "name" required class = "input0" maxlength = "3" theme>

        <select name = "gender" theme>
            <option value = "male" text = "text15" theme></option>
            <option value = "female" text = "text16" theme></option>
        </select><br>

        <label text = "text4" theme></label>
        <input type = "date" name = "birth" required class = "input1" theme><br><br>
        
        <label text = "text5" theme></label>
        <input type = "text" name = "wechat" class = "input2" maxlength = "20" theme><br>
        
        <label text = "text6" theme></label>
        <input type = "text" name = "qq" class = "input2" maxlength = "20" theme><br>
        
        <label text = "text17" theme></label>
        <input type = "tel" name = "telephone" class = "input2" maxlength = "20" theme><br>
        
        <label text = "text7" theme></label>
        <input type = "email" name = "email" class = "input3" maxlength = "30" theme><br><br>
        
        <label text = "text18" theme></label>
        <input type = "text" name = "color" class = "input2" maxlength = "3" theme><br>

    <div id = "result"></div>
</body>
